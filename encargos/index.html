<style>

.toast .tx{min-width:0}.toast b{display:block;font-size:14px}.toast small{display:block;color:#94a3b8;font-size:12px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gal{position:relative}.gnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0f172a;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2}.gnav.l{left:10px}.gnav.r{right:10px}.slides{cursor:grab}.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

.cnt{position:absolute;right:14px;top:12px;background:rgba(71,85,105,.9);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.dots{display:flex;justify-content:center;gap:8px;padding:12px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--bd)}.dots i.on{width:22px;border-radius:4px;background:var(--tx)}
.px{padding:0 14px}.badges{display:flex;gap:8px;margin:6px 0 10px}.badges b{font-size:13px;border-radius:999px;padding:6px 14px}
.ttl{font-size:25px;line-height:1.15;letter-spacing:-.6px;margin:0 0 8px}.rt{display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px}.rt a{color:var(--ac);font-weight:700}
.box{border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 14px 14px;background:var(--bg)}
.big{font-size:38px;font-weight:800;letter-spacing:-1px}.mu{color:var(--mu);font-size:14px}
.qty{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}.qty button{border:0;background:none;width:36px;height:36px;font-size:18px}.qty b{width:26px;text-align:center}
.eta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;font-size:14px}.eta div{display:grid;gap:4px}
.btn{width:100%;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;background:var(--ac);color:#fff;margin-top:12px}.btn.o{background:var(--bg);color:var(--ac);border:2px solid var(--ac);margin-top:10px}
.btn:disabled{opacity:.45}
select{width:100%;border:1px solid var(--bd);border-radius:12px;padding:13px;background:var(--bg);margin-top:6px}
.lb{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);margin-top:14px}
details summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none}details p{margin:10px 0 0;color:var(--mu);font-size:14px;line-height:1.5}
.bar{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:9px 0}.bar i{display:block;height:9px;border-radius:5px;background:var(--sf)}.bar i b{display:block;height:100%;border-radius:5px;background:var(--gd)}
.sbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--bg);border-top:1px solid var(--bd)}
.sbar div{max-width:560px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}.sbar b{font-size:22px;flex:1}.sbar .btn{width:auto;margin:0;padding:13px 20px;flex:none}
.sbar .cb{width:48px;height:48px;border-radius:12px;border:2px solid var(--ac);background:var(--bg);color:var(--ac);font-size:20px}
.empty{text-align:center;padding:60px 24px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:20px;margin:8px 0}
.demo{font-size:11px;color:var(--mu);margin-top:8px}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.pw{position:absolute;inset:0;display:grid;place-items:center;color:rgba(15,23,42,.45)}.pw .art{width:66%;height:66%}
.pw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.box input{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--sf);margin-top:6px}.box input[type=file]{padding:8px}
.back{border:1px solid var(--bd);background:var(--bg);border-radius:999px;padding:9px 16px;font-weight:700;margin:12px 14px}
.st{display:inline-block;flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.oc{display:block;width:calc(100% - 28px);text-align:left}
.seg{display:flex;gap:4px;margin-top:12px}.seg i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.seg i.on{background:var(--ac)}
.tl{list-style:none;margin:14px 0 0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:20px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:13px;top:28px;bottom:-2px;width:2px;background:var(--bd)}
.tl li:last-child::before{display:none}.tl li.dn::before{background:var(--ac)}
.tl .dt{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);display:grid;place-items:center;color:#fff;font-size:14px;z-index:1}
.tl .dn .dt{background:var(--ac);border-color:var(--ac)}
.tl .cu .dt{border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}.tl .cu .dt::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ac)}
.tl b{display:block;font-size:15px}.tl .pe b{color:var(--mu);font-weight:600}
.tl span{display:block;color:var(--mu);font-size:13px;margin-top:2px;line-height:1.4}.tl small{display:block;color:var(--ac);font-weight:700;font-size:12px;margin-top:4px}
.dm{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
</style></head><body>
<div id="app"></div>
<nav><div id="nv"></div></nav>
<script>
/* TARIFAS DE EJEMPLO: ajústalas aquí. tiers: [precio máximo, extra en US$]; si el extra es menor que 1 se toma como porcentaje. air/sea: US$ por libra. */
var CFG={wa:"50557294271",t:{air:"3 a 5 días hábiles",sea:"15 a 20 días hábiles"},rate:37.2,tiers:[[15,2],[50,4],[150,7],[1e9,.06]],air:8,sea:3.5,minW:.5,fee:0,
 dom:[["mgua","Entrega a domicilio en Managua",0],["cargo","Envío con Cargotrans",0]]};
function extra(v){for(var i=0;i<CFG.tiers.length;i++){var t=CFG.tiers[i];if(v<=t[0])return t[1]<1?v*t[1]:t[1]}return 0}
function quote(){var sub=0,sh=0;S.cart.forEach(function(c){var p=find(c.id);sub+=sale(p)*c.q;sh+=Math.max(p.w,CFG.minW)*c.q*CFG[c.m||"sea"]});var d=CFG.dom.filter(function(x){return x[0]===S.dom})[0],fee=S.cart.length?CFG.fee:0;return{sub:sub,sh:sh,fee:fee,dom:d[2],tot:sub+sh+fee+d[2]}}
/* Tiendas activas. Para volver a activar Shein o Temu, agrégalas aquí. */
var STORES=["Amazon"];
var CATBG={Audio:"#ede9fe",Moda:"#fce7f3",Hogar:"#ecfccb","Tecnología":"#e0f2fe",Belleza:"#ffe4e6",Juguetes:"#fef3c7",Deportes:"#dcfce7",Mascotas:"#ffedd5",Cocina:"#fee2e2",Herramientas:"#e2e8f0"};
var P=[];
var S={cat:"",dom:"mgua",cur:"USD",store:"Todos",q:"",cart:[],tut:true,qty:1};
function $(i){return document.getElementById(i)}
var ICO={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L22 7H5"/>',msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>',box:'<path d="m7.5 4.3 9 5.2"/><path d="M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/>',headphones:'<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',shirt:'<path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2z"/>',bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',phone:'<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',ship:'<path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.4 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.9 5.3 2.8 7.8"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6M12 10v4M12 2v3"/>',zap:'<path d="M4 14a1 1 0 0 1-.8-1.6l9.9-10.2a.5.5 0 0 1 .9.5L12.1 8.7A1 1 0 0 0 13 10h7a1 1 0 0 1 .8 1.6l-9.9 10.2a.5.5 0 0 1-.9-.5l1.9-6A1 1 0 0 0 11 14z"/>',play:'<path d="M6 3l14 9-14 9z"/>',arrowl:'<path d="m12 19-7-7 7-7M19 12H5"/>'};
var CI={Audio:"headphones",Moda:"shirt",Hogar:"bulb","Tecnología":"phone"};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICO[n]||"")+'</svg>'}
var SH='<ellipse cx="50" cy="90" rx="28" ry="4" fill="#0f172a" opacity=".12"/>';
var ART={





disco:'<svg class="art" viewBox="0 0 100 100"><path d="M50 4v16" stroke="#64748b" stroke-width="2"/><circle cx="50" cy="52" r="32" fill="#94a3b8"/><g stroke="#e2e8f0" stroke-width="1.5" opacity=".8"><path d="M18 52h64M24 34h52M24 70h52M50 20v64M34 22q-12 30 0 60M66 22q12 30 0 60"/></g><rect x="38" y="36" width="9" height="9" fill="#fff" opacity=".9"/><rect x="58" y="58" width="7" height="7" fill="#fff" opacity=".7"/></svg>'};
var ARTID={};
function pic(p,i){var u=(p.img||[])[i||0];return '<span class="pw">'+(ART[ARTID[p.id]]||ic(CI[p.c]||"box"))+(u?'<img src="'+esc(u)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</span>'}

function sale(p){return p.x?0:p.p+extra(p.p)}
function fmt(u){if(!u)return"Por confirmar";return S.cur==="USD"?"$"+u.toFixed(2):"C$ "+Math.round(u*CFG.rate).toLocaleString("en-US")}
function alt(u){if(!u)return"";return S.cur==="USD"?"C$ "+Math.round(u*CFG.rate).toLocaleString("en-US"):"$"+u.toFixed(2)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stars(r){var f=Math.round(r);return "★".repeat(f)+"☆".repeat(5-f)}
function find(id){return P.filter(function(p){return p.id===id})[0]}
function eta(d){var t=new Date();t.setDate(t.getDate()+d);return t.toLocaleDateString("es",{day:"numeric",month:"long"})}
function card(p){return '<div class="pc" onclick="go(\'p'+p.id+'\')"><div class="im" style="background:'+p.bg+'">'+pic(p)+'<span class="tag">'+p.s+'</span></div><div class="nm">'+esc(p.n)+'</div><div class="pr">'+fmt(sale(p))+'</div><div class="sb">'+alt(sale(p))+'</div>'+(p.x?'':'<button class="add" aria-label="Agregar" onclick="event.stopPropagation();addC('+p.id+',1)">'+ic("cart")+'</button>')+'</div>'}
function hdr(search){return '<header>'+(search?'<input id="q" placeholder="Buscar productos" value="'+esc(S.q)+'" oninput="S.q=this.value;home(true)">':'<b style="flex:1;font-size:18px">Encargos<span style="color:var(--gd)">.</span></b>')+'<button class="cur" onclick="S.cur=S.cur===\'USD\'?\'NIO\':\'USD\';route()"><i>$</i>'+(S.cur==="USD"?"US$":"C$")+'</button><button class="ib" aria-label="Notificaciones">'+ic("bell")+'</button></header>'}

function apCalc(p){var e=apE(p),imp=parseFloat(e.imp),pct=parseFloat(e.pct),ex=parseFloat(e.extra)||0;if(isNaN(imp))imp=0;if(isNaN(pct))pct=0;
 var pa=e.pAmazon!=null?parseFloat(e.pAmazon):(p.pAmazon||0),ev=e.envio!=null?parseFloat(e.envio):(p.envio||0);if(isNaN(pa))pa=0;if(isNaN(ev))ev=0;var net=pa+ev,base=Math.round(net*(1+imp/100)*100)/100,taxv=Math.round((base-net)*100)/100,
 fin=Math.round((base*(1+pct/100)+ex)*100)/100,err="";
 if(!(pa>0))err=p.edit?"Escribe el precio de Amazon.":"El robot no pudo leer el precio de Amazon. Descarta este producto y vuelve a intentarlo.";
 else if(ev<0)err="El envío no puede ser negativo.";
 else if(imp<0||imp>30)err="El impuesto debe estar entre 0 y 30 %.";
 else if(pct<COM_MIN)err="La comisión mínima es "+COM_MIN+" %.";
 else if(ex<0)err="El otro cargo no puede ser negativo.";
 else if(fin<=base)err="El precio final no cubre tu costo.";
 return{base:base,taxv:taxv,fin:fin,gan:Math.round((fin-base)*100)/100,err:err}}
function apMoney(n){return"$"+(Math.round((n||0)*100)/100).toFixed(2)}
function apUpd(id){var p=apFind(id);if(!p)return;var r=apCalc(p);
