<script>
// ====== CONFIGURACIÓN ======
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQMsJ-EFLAqytkzQeJN2Ain2NZYoo0t3mspkfEqvw0oCbFU3qci4ujImipAkz4hsE/exec"; // pega aquí la URL de tu Apps Script (termina en /exec)

 {n:'Pre-A1',t:'Estás en el punto de partida ideal: aquí entrenas desde la primera clase con frases simples y mucha guía.',a:'Preséntate en inglés: tu nombre, de dónde eres y qué te gusta hacer.'},

 catch(e){return {ok:false,error:'net'}}finally{clearTimeout(tm)}
}

function chime(){ // sonido de prueba generado aquí (WAV) y reproducido con <audio>, igual que los audios reales

 w(0,'RIFF');v.setUint32(4,36+len*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*2,true);d.forEach((x,i)=>v.setInt16(44+i*2,x,true));
