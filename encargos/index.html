<style>
:root{--bg:#fff;--sf:#f6f7f9;--tx:#0f172a;--mu:#64748b;--bd:#e5e7eb;--ac:#2563eb;--acs:#eff4ff;--gd:#f59e0b;--gr:#059669;--rd:#e11d48;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="dark"]{--bg:#0a0a0a;--sf:#171717;--tx:#f5f5f5;--mu:#a3a3a3;--bd:#2b2b2b;--ac:#5b8def;--acs:#1a2233;color-scheme:dark}
:root[data-theme="sand"]{--bg:#fbf7f0;--sf:#f3ece0;--tx:#2b2118;--mu:#8a7a66;--bd:#e6dccb;--ac:#b4691f;--acs:#f6ecd9}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.th button{border:2px solid var(--bd);background:var(--bg);border-radius:14px;padding:14px 6px;font-weight:600}.th button.on{border-color:var(--ac)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;cursor:pointer;color:inherit}input,select{font:inherit;color:var(--tx)}
#app{max-width:560px;margin:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:10px 14px}
header input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:11px 14px}
.cur{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 12px 6px 6px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:13px}
.cur i{font-style:normal;background:#0f172a;color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.ib{border:0;background:none;font-size:20px;padding:4px}.ib{position:relative}.bdg{position:absolute;top:-2px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#dc2626;color:#fff;font:700 10px/16px system-ui,sans-serif;text-align:center;font-style:normal}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.lgw{background:#fff;border-radius:10px;padding:3px 9px;height:34px;display:block}
.chip{flex:none;border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ban{margin:0 14px;border-radius:18px;padding:20px;background:linear-gradient(135deg,var(--acs),var(--sf));border:1px solid var(--bd)}
.ban h1{margin:0 0 6px;font-size:24px;line-height:1.15;letter-spacing:-.5px}.ban p{margin:0 0 14px;color:var(--mu);font-size:14px}
.banks{display:flex;gap:8px;flex-wrap:wrap}.banks span{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
.tut{margin:14px;border:1px solid var(--bd);background:var(--acs);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.tut small{color:var(--ac);font-weight:700;letter-spacing:.08em;font-size:11px}.tut b{display:block;font-size:16px;margin:2px 0}.tut span{font-size:13px;color:var(--mu)}
h2{font-size:19px;margin:22px 14px 10px;letter-spacing:-.3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.tile{position:relative;border:0;border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px;color:#0f172a;font:inherit;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile .thd{display:flex;align-items:center;justify-content:space-between;gap:8px}.tile .thd b{font-size:17px;letter-spacing:-.3px}
.tile .tgo{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:16px;line-height:1}
.tile .tcn{font-size:12px;color:rgba(15,23,42,.6);margin-top:-8px;font-weight:500}
.tile .tv{position:relative;height:104px;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.08)}
.tile .tsl{position:absolute;inset:0;opacity:0;transition:opacity .7s}.tile .tsl.on{opacity:1}
.tile .tsl .pw{color:rgba(15,23,42,.4)}.tile .tsl .pw .art{width:60%;height:60%}.tile .tsl .pw img{object-fit:contain;padding:6px;background:#fff}
.tile .tdots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:4px}.tile .tdots i{width:5px;height:5px;border-radius:50%;background:rgba(15,23,42,.18)}.tile .tdots i.on{width:14px;border-radius:3px;background:rgba(15,23,42,.6)}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.pc{flex:none;width:158px;border:1px solid var(--bd);border-radius:16px;background:var(--bg);overflow:hidden;cursor:pointer;position:relative}
.pc .im{height:130px;display:grid;place-items:center;font-size:54px;position:relative}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:2px 8px}
